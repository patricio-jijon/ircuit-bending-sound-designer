name: Verify published site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the published application
        shell: bash
        run: |
          url="https://patricio-jijon.github.io/ircuit-bending-sound-designer/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$url" --output page.html \
              && grep --fixed-strings --quiet '<title>Circuit Bending Sound Designer</title>' page.html; then
              echo "Published site is available at $url"
              exit 0
            fi
            echo "Attempt $attempt failed; waiting for Pages propagation."
            sleep 10
          done
          echo "Pages did not serve the expected application."
          exit 1
